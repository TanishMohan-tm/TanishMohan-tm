<svg width="100%" viewBox="0 0 660 210" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tanish Mohan - Terminal Profile</title>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="658" height="208" rx="10" fill="#0d1117" fill-opacity="0.82"/>
  <rect x="1" y="1" width="658" height="208" rx="10" fill="url(#glass)"/>
  <rect x="1" y="1" width="658" height="70" rx="10" fill="url(#shine)"/>
  <rect x="1" y="1" width="658" height="208" rx="10" fill="none" stroke="#1DB954" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="20" y1="1.5" x2="640" y2="1.5" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="22" r="5" fill="#febc2e"/>
  <circle cx="54" cy="22" r="5" fill="#28c840"/>
  <text x="76" y="26" font-family="'Fira Code',monospace" font-size="11" fill="#e6edf3">tanish@github ~ profile.py</text>
  <line x1="0" y1="40" x2="660" y2="40" stroke="#1DB954" stroke-opacity="0.12" stroke-width="0.5"/>

  <style>
    .ln { opacity: 0; animation: fi 0.25s forwards; font-family: 'Fira Code',monospace; font-size: 13px; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.7s; } .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; } .l6 { animation-delay: 2.3s; }
    .l7 { animation-delay: 2.7s; }
    .cur { animation: blink 1s step-end infinite; }
    @keyframes fi { to { opacity: 1; } }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>

  <text class="ln l1" x="20" y="64"><tspan fill="#1DB954">❯ </tspan><tspan fill="#e6edf3">python profile.py</tspan></text>
  <text class="ln l2" x="20" y="88" fill="#8b949e">{</text>
  <text class="ln l3" x="20" y="108"><tspan fill="#79c0ff">"name"</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#a5f3c6">"Tanish Mohan"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text class="ln l4" x="20" y="128"><tspan fill="#79c0ff">"role"</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#a5f3c6">"AI Engineer"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text class="ln l5" x="20" y="148"><tspan fill="#79c0ff">"stack"</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5f3c6">"Python"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"TensorFlow"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"LangChain"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"SQL"</tspan><tspan fill="#8b949e">]</tspan></text>
  <text class="ln l6" x="20" y="168" fill="#8b949e">}</text>
  <text class="ln l7" x="20" y="180"><tspan fill="#1DB954">❯ </tspan></text>
  <rect class="ln l7 cur" x="36" y="168" width="7" height="13" fill="#1DB954"/>
</svg>
