<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tanish Mohan - Terminal Profile</title>
  <rect width="680" height="220" rx="8" fill="#0d1117"/>
  
  <!-- window dots -->
  <circle cx="24" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="28" r="6" fill="#febc2e"/>
  <circle cx="64" cy="28" r="6" fill="#28c840"/>
  <text x="88" y="33" font-family="'Fira Code',monospace" font-size="12" fill="#555">tanish@github ~ profile.py</text>
  
  <!-- divider -->
  <line x1="0" y1="48" x2="680" y2="48" stroke="#21262d" stroke-width="1"/>

  <style>
    .line { opacity: 0; animation: fi 0.3s forwards; font-family: 'Fira Code',monospace; font-size: 13px; }
    .l1  { animation-delay: 0.3s; }
    .l2  { animation-delay: 0.8s; }
    .l3  { animation-delay: 1.3s; }
    .l4  { animation-delay: 1.7s; }
    .l5  { animation-delay: 2.1s; }
    .l6  { animation-delay: 2.5s; }
    .l7  { animation-delay: 2.9s; }
    .l8  { animation-delay: 3.3s; }
    @keyframes fi { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>

  <text class="line l1" x="24" y="78"><tspan fill="#1DB954">❯ </tspan><tspan fill="#e6edf3">python profile.py</tspan></text>
  <text class="line l2" x="24" y="102" fill="#8b949e">{</text>
  <text class="line l3" x="24" y="122"><tspan fill="#79c0ff">"name"</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#a5f3c6">"Tanish Mohan"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text class="line l4" x="24" y="142"><tspan fill="#79c0ff">"role"</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#a5f3c6">"AI Engineer"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text class="line l5" x="24" y="162"><tspan fill="#79c0ff">"stack"</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5f3c6">"Python"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"TensorFlow"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"LangChain"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5f3c6">"SQL"</tspan><tspan fill="#8b949e">]</tspan></text>
  <text class="line l6" x="24" y="182" fill="#8b949e">}</text>
  <text class="line l7" x="24" y="202"><tspan fill="#1DB954">❯ </tspan><rect class="cursor" x="40" y="190" width="8" height="14" fill="#1DB954"/></text>

  <!-- blinking cursor as rect -->
  <rect class="line l8 cursor" x="42" y="190" width="8" height="14" fill="#1DB954"/>
</svg>
